# Copy this file to config.toml and change what you like.
# Anything you leave out keeps its default.

[user]
name = "sir"              # what she calls you: "Guten Abend, Sir."
language = "de"           # the language she speaks and understands: "de" or "en"

[weather]
city = ""                 # "" = find your location automatically, or a city like "Berlin"
units = "metric"          # "metric" (°C) or "imperial" (°F)

[voice]
voice = ""                    # "" = the usual voice for her language (German: Katja);
                              # or e.g. "de-DE-AmalaNeural", "en-GB-LibbyNeural"
rate = "+0%"                  # speaking speed, e.g. "-10%" slower, "+10%" faster

[clap]
device = ""               # "" = default microphone, or part of its name, e.g. "PD200X"
                          # (see the list with: python -m assistant --devices)
threshold = 0.2           # lower if claps are missed, raise if it triggers too easily
                          # (find a good value with: python -m assistant --levels)
noise_ratio = 5.0         # how much louder than background noise a clap must be
onset_ratio = 3.0         # how sudden a clap must be (filters out speech and music)
min_gap = 0.15            # seconds allowed between the two claps
max_gap = 0.9
cooldown = 3.0

[listen]
enabled = true            # after greeting you, listen for a question and answer it
model = "small"           # speech recognition: "tiny", "base", "small", "medium" (bigger =
                          # more accurate but slower; small downloads about 480 MB once)
language = ""             # "" = same as [user] language; "auto" = detect it
end_after_quiet = 0       # 0 = keep talking until you say "stop" or "goodbye";
                          # or a number of seconds of quiet after which she stops
silence_seconds = 1.2     # this much quiet means you've finished
max_seconds = 15.0        # longest question
speech_ratio = 3.0        # how much louder than the room your voice must be...
min_level = 0.006         # ...and how loud at least; lower it if she doesn't hear you

[brain]
command = "claude"        # the Claude Code command; uses your Claude login
model = ""                # empty = Claude Code's default
timeout = 60
